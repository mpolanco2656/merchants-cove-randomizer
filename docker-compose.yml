services:
  merchants-cove-randomizer:
    build:
      context: .
      dockerfile: Dockerfile
    image: merchants-cove-randomizer:latest
    container_name: merchants-cove-randomizer
    ports:
      - "127.0.0.1:8086:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
